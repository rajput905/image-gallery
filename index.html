<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <h1>Image Gallery</h1>
    <p>Three columns on desktop, two on tablet, one on mobile.</p>
  </header>

  <nav class="filters" aria-label="Filter photos">
    <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
    <button class="filter-btn" data-filter="nature" aria-pressed="false">Nature</button>
    <button class="filter-btn" data-filter="city" aria-pressed="false">City</button>
    <button class="filter-btn" data-filter="coast" aria-pressed="false">Coast</button>
  </nav>

  <main class="gallery-wrap">
    <div class="gallery" id="gallery" aria-live="polite"></div>
    <div class="load-more-wrap">
      <button class="load-more" id="loadMore" type="button">Load more</button>
    </div>
  </main>

  <!-- Lightbox -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous photo">‹</button>
    <figure class="lb-figure">
      <img id="lbImg" src="" alt="">
      <figcaption>
        <span id="lbTitle"></span>
        <span id="lbCount" class="lb-count"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next photo">›</button>
  </dialog>

  <footer class="page-footer">
    <p>Photos from Unsplash.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
